services:
  firebase:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    command:
      - firebase
      - emulators:start
      - --project
      - demo-kufc
      - --only
      - auth,firestore,storage
      - --import=/data
      - --export-on-exit=/data
    ports:
      - "9099:9099" # Auth emulator
      - "8080:8080" # Firestore emulator
      - "9199:9199" # Storage emulator
      - "4000:4000" # Emulator UI
    volumes:
      - .:/workspace
      - firebase_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      firebase:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-kufc
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-kufc.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: demo-sender
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app-id
      NEXT_PUBLIC_FIREBASE_USE_EMULATORS: "true"
      NEXT_PUBLIC_FIREBASE_EMULATOR_HOST: ${NEXT_PUBLIC_FIREBASE_EMULATOR_HOST:-localhost}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  firebase_data:
